# Local development infrastructure only. Not a production or cloud definition.
#
# Images are pinned by digest (Phase 1 decisions G1/G2):
#   - PostgreSQL 17 / PostGIS 3.5 (production: RDS PostgreSQL)
#   - Redis OSS 7.2.16 (production target: ElastiCache Redis OSS 7.1;
#     application code must stay within 7.1-compatible commands). Not Valkey.
#
# Ports bind to 127.0.0.1 only. Credentials are local-only placeholders.

name: project-connect

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_connect
      POSTGRES_PASSWORD: local_project_connect_password
      POSTGRES_DB: project_connect
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U project_connect -d project_connect']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
