name: CI

# Validation only. No deployment, image publishing, cloud credentials,
# Terraform or database migrations run from this workflow.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Phase 1 decision G7: pnpm/setup (SHA-pinned), automatic install disabled.
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify exact toolchain
        run: |
          expected_node="v$(cat .nvmrc)"
          expected_pnpm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "node $(node --version) (expected $expected_node)"
          echo "pnpm $(pnpm --version) (expected $expected_pnpm)"
          test "$(node --version)" = "$expected_node"
          test "$(pnpm --version)" = "$expected_pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Guard script tests
        run: pnpm test:scripts

      - name: Architecture check
        run: pnpm architecture:check

      - name: Secret scan
        run: pnpm security:secrets

  build:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API and Admin
        run: pnpm build

      - name: API e2e
        run: pnpm test:e2e

      - name: Mobile Android bundle (offline export)
        run: pnpm --filter @project-connect/mobile export:android
        env:
          EXPO_OFFLINE: '1'
